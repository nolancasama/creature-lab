<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Drawn rather than typed: the web export carries no font with U+2699, so a gear
       character renders as a tofu box of hex digits in the browser. White so the button
       theme can tint it. -->
  <g fill="#ffffff">
    <g>
      <rect x="21" y="2.5" width="6" height="11" rx="2"/>
      <rect x="21" y="2.5" width="6" height="11" rx="2" transform="rotate(45 24 24)"/>
      <rect x="21" y="2.5" width="6" height="11" rx="2" transform="rotate(90 24 24)"/>
      <rect x="21" y="2.5" width="6" height="11" rx="2" transform="rotate(135 24 24)"/>
      <rect x="21" y="2.5" width="6" height="11" rx="2" transform="rotate(180 24 24)"/>
      <rect x="21" y="2.5" width="6" height="11" rx="2" transform="rotate(225 24 24)"/>
      <rect x="21" y="2.5" width="6" height="11" rx="2" transform="rotate(270 24 24)"/>
      <rect x="21" y="2.5" width="6" height="11" rx="2" transform="rotate(315 24 24)"/>
    </g>
    <path fill-rule="evenodd" d="M24,9 a15,15 0 1,0 0,30 a15,15 0 1,0 0,-30 z
                                 M24,17.5 a6.5,6.5 0 1,0 0,13 a6.5,6.5 0 1,0 0,-13 z"/>
  </g>
</svg>
